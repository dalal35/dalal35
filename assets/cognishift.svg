<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d">
  <title id="t">CogniShift results</title>
  <desc id="d">Mean ROC-AUC across five provider-grouped folds: logistic regression 0.865, random forest 0.862, majority-class baseline 0.500. 44,362 orders from 478 providers.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141920"/>
      <stop offset="1" stop-color="#0d1014"/>
    </linearGradient>
  </defs>
  <style>
    .sans{font-family:Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
    .mono{font-family:'SFMono-Regular',Consolas,Menlo,'Liberation Mono',monospace}
  </style>
  <rect x=".5" y=".5" width="999" height="499" rx="16" fill="url(#wash)" stroke="#262c35"/>

  <rect x="56" y="62" width="28" height="3" rx="1.5" fill="#e8404f"/>
  <text x="96" y="70" class="mono" font-size="13" letter-spacing="2.4" fill="#8b95a5"><tspan fill="#f2f4f7" font-weight="700">COGNISHIFT</tspan>  /  PROVIDER-GROUPED CV</text>

  <text x="52" y="196" class="sans" font-size="116" font-weight="700" letter-spacing="-3" fill="#f4f6f8">0.865</text>
  <text x="56" y="236" class="sans" font-size="22" font-weight="600" fill="#f4f6f8">ROC-AUC</text>
  <text x="56" y="264" class="sans" font-size="16" fill="#aab3c0">Logistic regression, with providers held</text>
  <text x="56" y="286" class="sans" font-size="16" fill="#aab3c0">out of training in every fold.</text>

  <path d="M56 352H456" stroke="#262c35"/>
  <g class="sans" fill="#f4f6f8" font-size="34" font-weight="700">
    <text x="56" y="404">44,362</text>
    <text x="206" y="404">478</text>
    <text x="316" y="404">5</text>
  </g>
  <g class="sans" fill="#8b95a5" font-size="14">
    <text x="56" y="430">orders analyzed</text>
    <text x="206" y="430">providers</text>
    <text x="316" y="430">provider-grouped folds</text>
  </g>

  <text x="520" y="110" class="mono" font-size="13" letter-spacing="2.4" fill="#8b95a5">MEAN ROC-AUC BY MODEL</text>
  <g stroke="#232a33">
    <path d="M520 136V392"/>
    <path d="M710 136V392"/>
    <path d="M900 136V392"/>
  </g>
  <g class="mono" font-size="13" fill="#6b7585" text-anchor="middle">
    <text x="520" y="414">0</text>
    <text x="710" y="414">0.5</text>
    <text x="900" y="414">1.0</text>
  </g>

  <g class="sans" font-size="16" fill="#e6e9ee">
    <text x="520" y="168">Logistic regression</text>
    <text x="520" y="258">Random forest</text>
    <text x="520" y="348">Majority-class baseline</text>
  </g>
  <rect x="520" y="180" width="328.7" height="26" rx="3" fill="#e8404f"/>
  <rect x="520" y="270" width="327.6" height="26" rx="3" fill="#8b95a5"/>
  <rect x="520" y="360" width="190" height="26" rx="3" fill="#3a4250"/>
  <g class="sans" font-size="16" font-weight="700" fill="#f4f6f8">
    <text x="858" y="199">0.865</text>
    <text x="857" y="289">0.862</text>
    <text x="720" y="379" fill="#aab3c0">0.500</text>
  </g>

  <text x="520" y="456" class="sans" font-size="14" fill="#6b7585">Five-fold means. Fold SD is 0.066 for both models.</text>
</svg>
